<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- TODO: a title per page, e.g. "My Site – Home" -->
  <title>My Site – Page title</title>
  <!-- W3.CSS (version 6) and then YOUR stylesheet – yours always comes after the framework -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Copy this file once per page: index.html, ….html.
       Header, navigation and footer are THE SAME on every page – only <main> changes. -->

  <!-- HEADER: site name + one sentence. The id "top" is the target of the "Back to top" links. -->
  <header class="w3-container w3-teal w3-padding-16" id="top">
    <h1>My Site</h1>
    <p>One sentence about the site.</p>
  </header>

  <!-- NAVIGATION: one link per page.
       Mark the CURRENT page: an extra colour class (e.g. w3-green) and aria-current="page". -->
  <nav class="w3-bar w3-light-grey" aria-label="Main navigation">
    <a href="index.html" class="w3-bar-item w3-button">Home</a>
    <!-- TODO: the other pages -->
  </nav>

  <main class="w3-container">
    <!-- TODO: the content of this page -->
  </main>

  <!-- FOOTER: an email link (mailto:), at least one external link that opens in a NEW tab
       (target="_blank" rel="noopener noreferrer") and a "Back to top" link (href="#top"). -->
  <footer class="w3-container w3-dark-grey w3-padding-16">
    <p>My Site · <a href="#top">Back to top</a></p>
  </footer>

</body>
</html>
