<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aroma Café - Meniu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand hero-title" href="index.html">Aroma Café</a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link nav-link-custom" href="index.html">Acasă</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom active" href="menu.html">Meniu</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="bg-success text-white text-center py-4">
    <div class="container">
      <h1 class="hero-title">Meniul Nostru</h1>
      <p>Alege produsele tale preferate</p>
    </div>
  </header>

  <main class="container my-5">
    <div class="list-group">
      <div class="list-group-item list-group-item-action card-lift py-3 mb-2">
        <div class="d-flex w-100 justify-content-between">
          <h5 class="mb-1">Espresso Simplu / Dublu</h5>
          <small class="text-muted">10 / 14 RON</small>
        </div>
        <p class="mb-1">Cafea 100% Arabica, extrasă la perfecție.</p>
      </div>
      <div class="list-group-item list-group-item-action card-lift py-3 mb-2">
        <div class="d-flex w-100 justify-content-between">
          <h5 class="mb-1">Latte Macchiato</h5>
          <small class="text-muted">16 RON</small>
        </div>
        <p class="mb-1">Lapte cald, strat bogat de espresso și spumă cremoasă.</p>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <div class="container">
      <p class="mb-0">Aroma Café &bull; <a href="#" class="text-white text-decoration-none">Back to top</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
